<div class="post-card card mb-3 p-3 shadow-sm">
    <h2>
        <a href="{% url 'post_detail' post.pk %}" class="text-decoration-none text-dark">{{ post.title }}</a>
    </h2>
    {% if post.author %}
        <p class="text-muted mb-0">
            <small>Автор: <a href="{% url 'profile' post.author.username %}">{{ post.author.username }}</a></small>
        </p>
    {% endif %}
</div>
