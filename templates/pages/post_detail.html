{% extends 'base.html' %}
{% block content %}
    <h1>{{ post.title }}</h1>
    <p><i>{{ post.created_at }}</i></p>
    <p><b>Автор:</b> {{ post.author.username|default:"Неизвестен" }}</p>
    <p>{{ post.text }}</p>

    <!-- Ссылки видны только автору поста -->
    {% if request.user == post.author %}
        <a href="{% url 'post_edit' post.pk %}">Редактировать</a> | 
        <a href="{% url 'post_delete' post.pk %}">Удалить</a>
    {% endif %}
{% endblock %}
