{% extends 'base.html' %}
{% block content %}
<div class="row justify-content-center">
    <div class="col-md-8 card p-4 shadow-sm mb-4">
        <h1 class="mb-3">{{ post.title }}</h1>
        <p class="text-muted border-bottom pb-2">
            <i>{{ post.created_at|date:"d.m.Y H:i" }}</i> | 
            <b>Автор:</b> <a href="{% url 'profile' post.author.username %}" class="text-decoration-none">{{ post.author.username }}</a>
        </p>

        <!-- Блок с картинкой -->
        {% if post.image %}
            <div class="text-center mb-4">
                <img src="{{ post.image.url }}" alt="{{ post.title }}" class="img-fluid rounded" style="max-height: 500px; object-fit: cover;">
            </div>
        {% endif %}

        <div class="post-text fs-5 mb-4" style="white-space: pre-line;">
            {{ post.text }}
        </div>
        
        {% if request.user == post.author %}
        <div class="mt-3">
            <a href="{% url 'post_edit' post.pk %}" class="btn btn-outline-secondary btn-sm">Редактировать</a>
            <a href="{% url 'post_delete' post.pk %}" class="btn btn-outline-danger btn-sm">Удалить</a>
        </div>
        {% endif %}
    </div>
</div>
{% endblock %}
