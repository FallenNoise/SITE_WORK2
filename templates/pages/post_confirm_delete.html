{% extends 'base.html' %}
{% block content %}
    <form method="post">
        {% csrf_token %}
        <p>Вы уверены, что хотите удалить пост "{{ post.title }}"?</p>
        <button type="submit">Да, удалить</button>
        <a href="{% url 'post_detail' post.pk %}">Отмена</a>
    </form>
{% endblock %}
