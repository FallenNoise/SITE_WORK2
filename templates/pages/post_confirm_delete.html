{% extends 'base.html' %}
{% block content %}
<div class="row justify-content-center mt-5">
    <div class="col-md-6">
        <div class="card shadow-sm p-4 text-center">
            <h3 class="mb-4">Вы уверены, что хотите удалить пост "{{ post.title }}"?</h3>
            <form method="post">
                {% csrf_token %}
                <!-- Классы btn btn-danger делают кнопку красной и стилизованной -->
                <button type="submit" class="btn btn-danger me-2">Да, удалить</button>
                <!-- Классы btn btn-secondary оформляют ссылку в виде серой кнопки -->
                <a href="{% url 'post_detail' post.slug %}" class="btn btn-secondary">Отмена</a>
            </form>
        </div>
    </div>
</div>
{% endblock %}
